spring.application.name=bigdata-pro3
server.address=127.0.0.1
server.port=${PRO3_WEB_PORT:8083}
spring.datasource.url=${PRO3_DB_URL:jdbc:mysql://127.0.0.1:3307/sau_pro3?connectionTimeZone=UTC}
spring.datasource.username=${PRO3_DB_USER:pro3}
spring.datasource.password=${PRO3_DB_PASSWORD:pro3-local}
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=6MB
pro3.spark.url=${PRO3_SPARK_URL:http://127.0.0.1:8093}
pro3.hdfs.uri=${PRO3_HDFS_URI:hdfs://localhost:9000}
pro3.hdfs.directory=${PRO3_HDFS_DIRECTORY:/sau-pro3/photos}
